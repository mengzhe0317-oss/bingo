    <script>
      // Ensure window.fetch is writable and configurable to prevent polyfill TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentDesc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                              Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
            if (currentDesc && (!currentDesc.writable || !currentDesc.set)) {
              var fetchRef = originalFetch;
              Object.defineProperty(window, 'fetch', {
                get: function() { return fetchRef; },
                set: function(fn) { fetchRef = fn; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // continue silently
        }
      })();
    </script>
